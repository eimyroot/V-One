name: branch authentication rate-limit service composition

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: branch-authentication-rate-limit-service-composition
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'nulleimy/V-One' &&
      github.event.pull_request.head.ref == 'agent/authentication-rate-limit-service-composition-20260717'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/authentication-rate-limit-service-composition-20260717
          persist-credentials: true
          fetch-depth: 1
          show-progress: false
      - name: Detect pending transform
        id: transform
        shell: bash
        run: |
          if [ -f scripts/apply_authentication_rate_limit_service_composition.py ] && \
             [ ! -f .github/AUTH_RATE_LIMIT_TRANSFORM_ERROR.txt ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Normalize assertion anchor
        if: steps.transform.outputs.pending == 'true'
        run: python3 scripts/normalize_authentication_rate_limit_transform_anchor.py
      - name: Apply assertion-bound transform
        if: steps.transform.outputs.pending == 'true'
        shell: bash
        run: |
          set +e
          output="$(python3 scripts/apply_authentication_rate_limit_service_composition.py 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            printf '%s\n' "$output" > .github/AUTH_RATE_LIMIT_TRANSFORM_ERROR.txt
            git config user.name "VOODOO Governance Bot"
            git config user.email "governance-bot@users.noreply.github.com"
            git add .github/AUTH_RATE_LIMIT_TRANSFORM_ERROR.txt
            git commit -m "chore: capture authentication rate-limit transform assertion"
            git push origin HEAD:agent/authentication-rate-limit-service-composition-20260717
            exit "$status"
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.transform.outputs.pending == 'true'
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        if: steps.transform.outputs.pending == 'true'
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Normalize changed Python
        if: steps.transform.outputs.pending == 'true'
        run: >-
          python -m ruff check --fix
          voodoo_product/auth_rate_limit.py
          voodoo_product/service.py
          voodoo_product/composition.py
          tests/system/test_authentication_rate_limit_service.py
          tests/system/test_statement_catalog.py
          scripts/product_readiness_gate.py
      - name: Verify changed Python lint
        if: steps.transform.outputs.pending == 'true'
        run: >-
          python -m ruff check
          voodoo_product/auth_rate_limit.py
          voodoo_product/service.py
          voodoo_product/composition.py
          tests/system/test_authentication_rate_limit_service.py
          tests/system/test_statement_catalog.py
          scripts/product_readiness_gate.py
      - name: Compile transformed source
        if: steps.transform.outputs.pending == 'true'
        run: python -m compileall -q voodoo_product scripts tests
      - name: Verify transformed diff
        if: steps.transform.outputs.pending == 'true'
        run: git diff --check
      - name: Authentication rate-limit governance gates
        if: steps.transform.outputs.pending == 'true'
        run: >-
          python -m pytest -q
          tests/system/test_authentication_rate_limit_service.py
          tests/system/test_product_composition.py
          tests/system/test_statement_catalog.py
      - name: Authentication compatibility gates
        if: steps.transform.outputs.pending == 'true'
        run: >-
          python -m pytest -q
          tests/system/test_auth_rate_limiting.py
          tests/system/test_http_security.py
          tests/system/test_identity_provider.py
          tests/system/test_token_security.py
      - name: Product compatibility gate
        if: steps.transform.outputs.pending == 'true'
        run: python -m pytest -q tests/system/test_product_platform_rc1.py
      - name: Product readiness gate
        if: steps.transform.outputs.pending == 'true'
        run: python scripts/product_readiness_gate.py
      - name: Remove branch-only executor scripts
        if: steps.transform.outputs.pending == 'true'
        run: >-
          git rm -f
          scripts/apply_authentication_rate_limit_service_composition.py
          scripts/normalize_authentication_rate_limit_transform_anchor.py
      - name: Verify exact scope and commit
        if: steps.transform.outputs.pending == 'true'
        shell: bash
        run: |
          git add -N \
            docs/product/AUTHENTICATION_RATE_LIMIT_SERVICE_COMPOSITION_BOUNDARY.md \
            tests/system/test_authentication_rate_limit_service.py \
            voodoo_product/auth_rate_limit.py
          python - <<'PY'
          import subprocess

          expected = {
              "docs/product/AUTHENTICATION_RATE_LIMIT_SERVICE_COMPOSITION_BOUNDARY.md",
              "scripts/apply_authentication_rate_limit_service_composition.py",
              "scripts/normalize_authentication_rate_limit_transform_anchor.py",
              "scripts/product_readiness_gate.py",
              "tests/system/test_authentication_rate_limit_service.py",
              "tests/system/test_statement_catalog.py",
              "voodoo_product/auth_rate_limit.py",
              "voodoo_product/composition.py",
              "voodoo_product/service.py",
          }
          worktree = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          index = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          actual = worktree | index
          if actual != expected:
              raise SystemExit(
                  f"unexpected scope: missing={expected - actual}, extra={actual - expected}"
              )
          PY
          git config user.name "VOODOO Governance Bot"
          git config user.email "governance-bot@users.noreply.github.com"
          git add \
            docs/product/AUTHENTICATION_RATE_LIMIT_SERVICE_COMPOSITION_BOUNDARY.md \
            scripts/product_readiness_gate.py \
            tests/system/test_authentication_rate_limit_service.py \
            tests/system/test_statement_catalog.py \
            voodoo_product/auth_rate_limit.py \
            voodoo_product/composition.py \
            voodoo_product/service.py
          git commit -m "architecture: add shared authentication rate-limit service boundary"
          git push origin HEAD:agent/authentication-rate-limit-service-composition-20260717

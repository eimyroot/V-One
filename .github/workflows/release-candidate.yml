name: release-candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release candidate, for example 0.9.0-rc2
        required: true
        type: string
      confirmation:
        description: Type BUILD_RC to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.confirmation == 'BUILD_RC' && github.ref == 'refs/heads/main'
    environment: release-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VOODOO_ALLOW_PRODUCTION_EFFECTS: "false"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Validate release candidate version
        env:
          RC_VERSION: ${{ inputs.version }}
        run: python scripts/validate_release_candidate.py "$RC_VERSION"
      - name: Verify release candidate
        run: |
          python -m ruff check .
          python -m compileall -q voodoo_product scripts tests
          node --check voodoo_product/static/app.js
          python -m pytest -q
          python scripts/product_readiness_gate.py
          python -m pip_audit --disable-pip --strict -r requirements-product.lock --require-hashes
      - name: Build product image
        env:
          RC_VERSION: ${{ inputs.version }}
        run: docker build --tag "voodoo-one:rc-${RC_VERSION}" --file Dockerfile.product .
      - name: Smoke test product image
        shell: bash
        env:
          RC_VERSION: ${{ inputs.version }}
        run: bash scripts/smoke_product_image.sh "voodoo-one:rc-${RC_VERSION}" "rc-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Build source archive, SBOM and checksums
        env:
          RC_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="v-one-${RC_VERSION}/" -o "dist/v-one-${RC_VERSION}.tar.gz" HEAD
          python -m pip_audit --disable-pip --strict -r requirements-product.lock --require-hashes -f cyclonedx-json -o dist/sbom.cdx.json
          cd dist
          sha256sum "v-one-${RC_VERSION}.tar.gz" sbom.cdx.json > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v-one-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

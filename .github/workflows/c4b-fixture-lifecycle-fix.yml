name: c4b-fixture-lifecycle-fix

on:
  push:
    branches:
      - feat/durable-execution-epoch-lease-r1
    paths:
      - .github/workflows/c4b-fixture-lifecycle-fix.yml

permissions:
  contents: write

jobs:
  patch-c4b-fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: feat/durable-execution-epoch-lease-r1
      - name: Apply exact fixture patch
        run: python scripts/c4b_fixture_patch.py
      - name: Verify patch
        run: |
          git diff --check
          python -m pytest -q tests/system/test_durable_execution_epoch_lease.py
      - name: Commit fixture fix
        run: |
          set -euo pipefail
          git config user.name "Eimy Herrer"
          git config user.email "fck.police.228@gmail.com"
          git add tests/system/test_durable_execution_epoch_lease.py
          git commit -m "test(dispatch): seed c4b through governed review lifecycle"
          git push origin HEAD:feat/durable-execution-epoch-lease-r1

name: c4b-fixture-lifecycle-fix

on:
  push:
    branches:
      - feat/durable-execution-epoch-lease-r1
    paths:
      - .github/workflows/c4b-fixture-lifecycle-fix.yml

permissions:
  contents: write

jobs:
  patch-c4b-fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: feat/durable-execution-epoch-lease-r1
      - name: Replace invalid direct approval seed with governed lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/system/test_durable_execution_epoch_lease.py")
          text = path.read_text(encoding="utf-8")
          old = '''        connection.execute(
              """
              INSERT INTO change_requests(
                  id, workspace_id, title, description, risk, environment, adapter,
                  payload_json, status, requested_by, created_at, updated_at,
                  review_content_sha256
              ) VALUES (
                  'cr_c4b', 'wrk_main', 'C4b', '', 'R1', 'local', 'echo', '{}',
                  'APPROVED', 'usr_admin',
                  '2026-08-17T05:00:00.000+00:00',
                  '2026-08-17T05:02:00.000+00:00', ?
              )
              """,
              (REVIEW_DIGEST,),
          )
'''
          new = '''        connection.execute(
              """
              INSERT INTO change_requests(
                  id, workspace_id, title, description, risk, environment, adapter,
                  payload_json, status, requested_by, created_at, updated_at
              ) VALUES (
                  'cr_c4b', 'wrk_main', 'C4b', '', 'R1', 'local', 'echo', '{}',
                  'DRAFT', 'usr_admin',
                  '2026-08-17T05:00:00.000+00:00',
                  '2026-08-17T05:00:00.000+00:00'
              )
              """
          )
          connection.execute(
              """
              UPDATE change_requests
              SET status = 'REVIEW_REQUIRED',
                  review_content_sha256 = ?,
                  updated_at = '2026-08-17T05:01:00.000+00:00'
              WHERE id = 'cr_c4b'
              """,
              (REVIEW_DIGEST,),
          )
          connection.execute(
              """
              UPDATE change_requests
              SET status = 'APPROVED',
                  updated_at = '2026-08-17T05:02:00.000+00:00'
              WHERE id = 'cr_c4b'
              """
          )
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected direct-approval seed exactly once, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          git diff -- tests/system/test_durable_execution_epoch_lease.py
      - name: Run focused C4b test
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/system/test_durable_execution_epoch_lease.py
      - name: Commit fixture fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Eimy Herrer"
          git config user.email "fck.police.228@gmail.com"
          git add tests/system/test_durable_execution_epoch_lease.py
          git commit -m "test(dispatch): seed c4b through governed review lifecycle"
          git push origin HEAD:feat/durable-execution-epoch-lease-r1

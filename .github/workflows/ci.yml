name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q voodoo_product scripts tests
      - name: Test
        run: python -m pytest -q
      - name: Product readiness gate
        run: python scripts/product_readiness_gate.py
      - name: Dependency vulnerability audit
        run: python -m pip_audit --disable-pip --strict -r requirements-product.lock --require-hashes

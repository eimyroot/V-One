name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q voodoo_product scripts tests
      - name: Test
        run: python -m pytest -q
      - name: Product readiness gate
        run: python scripts/product_readiness_gate.py
      - name: Dependency vulnerability audit
        run: python -m pip_audit --disable-pip --strict -r requirements-product.lock --require-hashes
      - name: Build product image
        run: docker build --tag voodoo-one:ci --file Dockerfile.product .
      - name: Smoke test product image
        shell: bash
        run: bash scripts/smoke_product_image.sh voodoo-one:ci "ci-${{ github.run_id }}-${{ github.run_attempt }}"

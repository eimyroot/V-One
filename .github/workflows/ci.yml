name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q voodoo_product scripts tests
      - name: Test
        run: python -m pytest -q
      - name: Product readiness gate
        run: python scripts/product_readiness_gate.py
      - name: Dependency vulnerability audit
        run: python -m pip_audit --disable-pip --strict -r requirements-product.lock --require-hashes
      - name: Build product image
        run: docker build --tag voodoo-one:ci --file Dockerfile.product .
      - name: Smoke test product image
        shell: bash
        run: |
          set -euo pipefail
          container="voodoo-one-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          data_volume="voodoo-one-ci-data-${{ github.run_id }}-${{ github.run_attempt }}"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker volume rm --force "$data_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$data_volume" >/dev/null
          docker run --detach \
            --name "$container" \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --pids-limit 128 \
            --mount "type=volume,source=$data_volume,target=/app/storage/product" \
            --publish 127.0.0.1:18000:8000 \
            --env VOODOO_ENV=local \
            --env VOODOO_ROOT=/app \
            --env VOODOO_DATABASE_BACKEND=sqlite \
            --env VOODOO_PRODUCT_DB=/app/storage/product/voodoo_one.sqlite3 \
            --env VOODOO_PRODUCT_SANDBOX_ROOT=/app/storage/product/sandboxes \
            --env VOODOO_SESSION_SIGNING_SECRET=ci-session-signing-secret-00000000000000000000000000000000 \
            --env VOODOO_BOOTSTRAP_TOKEN=ci-bootstrap-token-000000000000000000000000 \
            --env VOODOO_TRUSTED_HOSTS=127.0.0.1 \
            --env VOODOO_ALLOW_PRODUCTION_EFFECTS=false \
            voodoo-one:ci >/dev/null

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18000/api/v1/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done

          health_headers="$(curl --fail --silent --show-error --dump-header - \
            --output /dev/null http://127.0.0.1:18000/api/v1/health)"
          grep --ignore-case --fixed-strings "cache-control: no-store" <<<"$health_headers"
          grep --ignore-case --fixed-strings "content-security-policy:" <<<"$health_headers"
          if grep --ignore-case --quiet "^server:" <<<"$health_headers"; then
            exit 1
          fi

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Host: evil.example' http://127.0.0.1:18000/api/v1/health)" = "400"
          curl --fail --silent --show-error http://127.0.0.1:18000/api/v1/health | \
            python -c 'import json,sys; data=json.load(sys.stdin); assert data["production_effects"] == "DISABLED"'

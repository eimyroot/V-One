name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q voodoo_product scripts tests
      - name: Migration regression gate
        run: python -m pytest tests/system/test_database_migrations.py -q
      - name: External identity binding gate
        run: >-
          python -m pytest -q
          tests/system/test_external_identity_binding.py
          tests/system/test_governed_external_identity_service.py
      - name: Evidence ledger composition gate
        run: >-
          python -m pytest -q
          tests/system/test_evidence_primitives.py
          tests/system/test_receipt_ledger.py
          tests/system/test_product_composition.py
      - name: Authentication and HTTP gate
        run: >-
          python -m pytest -q
          tests/system/test_auth_rate_limiting.py
          tests/system/test_http_security.py
          tests/system/test_identity_provider.py
          tests/system/test_token_security.py
      - name: Authentication rate-limit governance gate
        run: python -m pytest -q tests/system/test_authentication_rate_limit_service.py
      - name: Bootstrap governance gate
        run: python -m pytest -q tests/system/test_bootstrap_service.py
      - name: User account governance gate
        run: python -m pytest -q tests/system/test_user_account_service.py
      - name: Platform status governance gate
        run: python -m pytest -q tests/system/test_platform_status_service.py
      - name: Workspace governance gate
        run: python -m pytest -q tests/system/test_workspace_service.py
      - name: Change request governance gate
        run: python -m pytest -q tests/system/test_change_request_service.py
      - name: Execution and persistence gate
        run: >-
          python -m pytest -q
          tests/system/test_operational_safety.py
          tests/system/test_execution_service.py
          tests/system/test_execution_idempotency.py
          tests/system/test_execution_recovery.py
          tests/system/test_persistence_boundary.py
          tests/system/test_statement_catalog.py
      - name: Sandbox filesystem security gate
        run: >-
          python -m pytest -q
          tests/system/test_adapter_sandbox_security.py
          tests/system/test_product_platform_rc1.py::test_symlinked_sandbox_directory_fails_closed
      - name: Product and release gate
        run: >-
          python -m pytest -q
          tests/system/test_observability.py
          tests/system/test_product_platform_rc1.py
          tests/system/test_release_supply_chain.py
      - name: Test
        run: python -m pytest -q
      - name: Product readiness gate
        run: python scripts/product_readiness_gate.py
      - name: Dependency vulnerability audit
        run: python -m pip_audit --disable-pip --strict -r requirements-product.lock --require-hashes
      - name: Build product image
        run: docker build --tag voodoo-one:ci --file Dockerfile.product .
      - name: Smoke test product image
        shell: bash
        run: bash scripts/smoke_product_image.sh voodoo-one:ci "ci-${{ github.run_id }}-${{ github.run_attempt }}"

name: branch receipt ledger composition

on:
  push:
    branches:
      - agent/receipt-ledger-composition-20260717
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: branch-receipt-ledger-composition
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'nulleimy/V-One' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.ref == 'agent/receipt-ledger-composition-20260717')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/receipt-ledger-composition-20260717
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Apply assertion-bound transform
        run: python scripts/apply_receipt_ledger_composition.py
      - name: Normalize changed Python
        run: >-
          python -m ruff check --fix
          voodoo_product/service.py
          voodoo_product/receipt.py
          voodoo_product/composition.py
          tests/system/test_receipt_ledger.py
          tests/system/test_product_composition.py
          tests/system/test_statement_catalog.py
          scripts/product_readiness_gate.py
          scripts/apply_receipt_ledger_composition.py
      - name: Verify changed Python lint
        run: >-
          python -m ruff check
          voodoo_product/service.py
          voodoo_product/receipt.py
          voodoo_product/composition.py
          tests/system/test_receipt_ledger.py
          tests/system/test_product_composition.py
          tests/system/test_statement_catalog.py
          scripts/product_readiness_gate.py
          scripts/apply_receipt_ledger_composition.py
      - name: Compile transformed source
        run: python -m compileall -q voodoo_product scripts tests
      - name: Verify transformed diff
        run: git diff --check
      - name: Run focused evidence and execution gates
        run: >-
          python -m pytest -q
          tests/system/test_evidence_primitives.py
          tests/system/test_receipt_ledger.py
          tests/system/test_product_composition.py
          tests/system/test_execution_idempotency.py
          tests/system/test_execution_recovery.py
          tests/system/test_statement_catalog.py
          tests/system/test_product_platform_rc1.py
      - name: Remove branch-only executor
        run: |
          git rm scripts/apply_receipt_ledger_composition.py
          git rm .github/workflows/branch-receipt-ledger-composition.yml
      - name: Verify exact scope and commit
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/branch-receipt-ledger-composition.yml",
              ".github/workflows/ci.yml",
              "docs/product/RECEIPT_LEDGER_COMPOSITION_BOUNDARY.md",
              "scripts/apply_receipt_ledger_composition.py",
              "scripts/product_readiness_gate.py",
              "tests/system/test_product_composition.py",
              "tests/system/test_receipt_ledger.py",
              "tests/system/test_statement_catalog.py",
              "voodoo_product/composition.py",
              "voodoo_product/receipt.py",
              "voodoo_product/service.py",
          }
          actual = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if actual != expected:
              raise SystemExit(f"unexpected scope: missing={expected - actual}, extra={actual - expected}")
          PY
          git config user.name "VOODOO Governance Bot"
          git config user.email "governance-bot@users.noreply.github.com"
          git add -A
          git commit -m "architecture: add shared receipt ledger boundary"
          git push origin HEAD:agent/receipt-ledger-composition-20260717

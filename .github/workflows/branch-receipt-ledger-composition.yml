name: branch receipt ledger composition

on:
  push:
    branches:
      - agent/receipt-ledger-composition-20260717
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: branch-receipt-ledger-composition
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'nulleimy/V-One' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.ref == 'agent/receipt-ledger-composition-20260717')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/receipt-ledger-composition-20260717
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Apply assertion-bound transform
        run: python scripts/apply_receipt_ledger_composition.py
      - name: Move receipt monkeypatch ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/system/test_product_platform_rc1.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "import voodoo_product.service as service_module\n": (
                  "import voodoo_product.receipt as receipt_module\n"
              ),
              "original_new_id = service_module.new_id": "original_new_id = receipt_module.new_id",
              "        service_module,\n        \"utc_now\",": (
                  "        receipt_module,\n        \"utc_now\","
              ),
              "monkeypatch.setattr(service_module, \"new_id\", controlled_new_id)": (
                  "monkeypatch.setattr(receipt_module, \"new_id\", controlled_new_id)"
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one RC1 ownership match: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Normalize transformed file endings
        run: >-
          python -c "from pathlib import Path;
          p=Path('voodoo_product/service.py');
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')"
      - name: Normalize changed Python
        run: >-
          python -m ruff check --fix
          voodoo_product/service.py
          voodoo_product/receipt.py
          voodoo_product/composition.py
          tests/system/test_receipt_ledger.py
          tests/system/test_product_composition.py
          tests/system/test_product_platform_rc1.py
          tests/system/test_statement_catalog.py
          scripts/product_readiness_gate.py
          scripts/apply_receipt_ledger_composition.py
      - name: Verify changed Python lint
        run: >-
          python -m ruff check
          voodoo_product/service.py
          voodoo_product/receipt.py
          voodoo_product/composition.py
          tests/system/test_receipt_ledger.py
          tests/system/test_product_composition.py
          tests/system/test_product_platform_rc1.py
          tests/system/test_statement_catalog.py
          scripts/product_readiness_gate.py
          scripts/apply_receipt_ledger_composition.py
      - name: Compile transformed source
        run: python -m compileall -q voodoo_product scripts tests
      - name: Verify transformed diff
        run: git diff --check
      - name: Evidence ledger gates
        run: >-
          python -m pytest -q
          tests/system/test_evidence_primitives.py
          tests/system/test_receipt_ledger.py
          tests/system/test_product_composition.py
      - name: Execution and recovery gates
        run: >-
          python -m pytest -q
          tests/system/test_execution_idempotency.py
          tests/system/test_execution_recovery.py
      - name: Statement catalog gate
        run: python -m pytest -q tests/system/test_statement_catalog.py
      - name: Product RC1 gate
        run: python -m pytest -q tests/system/test_product_platform_rc1.py
      - name: Remove branch-only executor
        run: |
          git rm scripts/apply_receipt_ledger_composition.py
          git rm .github/workflows/branch-receipt-ledger-composition.yml
      - name: Verify exact scope and commit
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/branch-receipt-ledger-composition.yml",
              ".github/workflows/ci.yml",
              "docs/product/RECEIPT_LEDGER_COMPOSITION_BOUNDARY.md",
              "scripts/apply_receipt_ledger_composition.py",
              "scripts/product_readiness_gate.py",
              "tests/system/test_product_composition.py",
              "tests/system/test_product_platform_rc1.py",
              "tests/system/test_receipt_ledger.py",
              "tests/system/test_statement_catalog.py",
              "voodoo_product/composition.py",
              "voodoo_product/receipt.py",
              "voodoo_product/service.py",
          }
          actual = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if actual != expected:
              raise SystemExit(f"unexpected scope: missing={expected - actual}, extra={actual - expected}")
          PY
          git config user.name "VOODOO Governance Bot"
          git config user.email "governance-bot@users.noreply.github.com"
          git add -A
          git commit -m "architecture: add shared receipt ledger boundary"
          git push origin HEAD:agent/receipt-ledger-composition-20260717

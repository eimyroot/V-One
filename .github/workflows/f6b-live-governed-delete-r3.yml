name: f6b-first-live-governed-delete-r3

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/f6b-live-governed-delete-r3.yml"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: f6b-first-live-governed-delete-pr123-r3
  cancel-in-progress: false

env:
  F6B_EXPECTED_HEAD_REF: "feat/f6b-first-live-governed-delete-prep-r1"
  F6B_R3_PARENT_SHA: "83b52c65627f52511f609740a4598d28caca5616"
  F6B_CANONICAL_MAIN_SHA: "2473a37f791c51a8a419a9eb88a78fdbd23a9bcd"
  F6B_TARGET_REPOSITORY: "nulleimy/V-One"
  F6B_TARGET_REF: "refs/heads/vone-canary/f4b-pr120-32185703943"
  F6B_EXPECTED_REF_SHA: "83f9c43357460e49b1eba82f124a13015a8e6a88"
  F6B_CAPABILITY: "github.delete-exact-created-ref/v1"
  F6B_CREDENTIAL_CLASS: "github.delete-ref/scoped-v1"
  F6B_VERIFIER_CREDENTIAL_CLASS: "github.actions-token.verifier-read/v1"
  F6B_TEMPORAL_MODEL: "READ_THEN_DELETE_NON_ATOMIC"

jobs:
  fresh-live-preflight:
    if: >-
      github.event.pull_request.number == 123 &&
      github.event.pull_request.head.ref == 'feat/f6b-first-live-governed-delete-prep-r1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      preflight_digest: ${{ steps.preflight.outputs.preflight_digest }}
    steps:
      - name: Checkout exact R3 head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Exact R3 activation lineage
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$EVENT_BASE_SHA" = "$F6B_CANONICAL_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$F6B_R3_PARENT_SHA"
          test "$(git diff --name-only "$F6B_R3_PARENT_SHA" HEAD)" = ".github/workflows/f6b-live-governed-delete-r3.yml"
          echo "F6B_R3_EXACT_LINEAGE=PASS"

      - name: Wait for exact-head CI
        env:
          GH_READ_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,time,urllib.parse,urllib.request
          repo=os.environ['F6B_TARGET_REPOSITORY'];sha=os.environ['EVENT_HEAD_SHA'];token=os.environ['GH_READ_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'v-one-f6b-r3-ci/1'}
          url=f'https://api.github.com/repos/{repo}/actions/runs?'+urllib.parse.urlencode({'head_sha':sha,'event':'pull_request','per_page':100})
          for _ in range(180):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=15) as r: data=json.loads(r.read().decode())
              runs=[x for x in data.get('workflow_runs',[]) if x.get('name')=='ci']
              if runs:
                  run=max(runs,key=lambda x:x['id'])
                  if run.get('status')=='completed':
                      if run.get('conclusion')!='success': raise SystemExit(f"F6B_R3_CI={run.get('conclusion')}")
                      print(f"F6B_R3_EXACT_HEAD_CI=PASS run_id={run['id']}");break
              time.sleep(4)
          else: raise SystemExit('F6B_R3_CI_TIMEOUT')
          PY

      - name: Fresh review main and exact target gate
        id: preflight
        env:
          GH_READ_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,urllib.error,urllib.request
          from datetime import UTC,datetime
          repo=os.environ['F6B_TARGET_REPOSITORY'];owner,name=repo.split('/',1);token=os.environ['GH_READ_TOKEN'];head=os.environ['EVENT_HEAD_SHA'];main_sha=os.environ['F6B_CANONICAL_MAIN_SHA'];ref=os.environ['F6B_TARGET_REF'];expected=os.environ['F6B_EXPECTED_REF_SHA']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'v-one-f6b-r3-preflight/1'}
          def get(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}{path}',headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as exc:return exc.code,None
          status,pr=get('/pulls/123');assert status==200 and pr['state']=='open' and pr['head']['sha']==head and pr['head']['ref']==os.environ['F6B_EXPECTED_HEAD_REF'] and pr['base']['sha']==main_sha
          query='''query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved} pageInfo{hasNextPage}}}}}''';body=json.dumps({'query':query,'variables':{'owner':owner,'name':name,'number':123}}).encode();request=urllib.request.Request('https://api.github.com/graphql',data=body,headers={**headers,'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request,timeout=15) as r:graph=json.loads(r.read().decode())
          assert not graph.get('errors');threads=graph['data']['repository']['pullRequest']['reviewThreads'];assert not threads['pageInfo']['hasNextPage'] and not [x for x in threads['nodes'] if not x['isResolved']]
          status,main=get('/git/ref/heads/main');assert status==200 and main['object']['sha']==main_sha
          path=ref.removeprefix('refs/');status,target=get(f'/git/ref/{path}');assert status==200 and target['ref']==ref and target['object']['sha']==expected
          record={'schema_version':1,'record_type':'f6b-live-pre-effect-authorization-record/v1','pr':123,'head_sha':head,'base_sha':main_sha,'target_repository':repo,'target_ref':ref,'expected_sha':expected,'capability':os.environ['F6B_CAPABILITY'],'temporal_model':os.environ['F6B_TEMPORAL_MODEL'],'max_provider_mutations':1,'unresolved_review_threads':0,'checked_at':datetime.now(UTC).isoformat(timespec='milliseconds')};digest=hashlib.sha256(json.dumps(record,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'preflight_digest={digest}\n')
          print(f'F6B_R3_FRESH_PREFLIGHT=PASS digest={digest}')
          PY

      - name: Locked dependency and F6 static gate
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m ruff check voodoo_product/rollback_control.py voodoo_product/rollback_runtime.py voodoo_product/github_delete_ref_runtime.py voodoo_product/rollback_verification.py voodoo_product/execution_receipt_v2.py tests/system/test_rollback_control.py tests/system/test_github_delete_ref_runtime.py tests/system/test_rollback_verification.py tests/system/test_f6_vop_registry.py
          python -m pytest -q tests/system/test_rollback_control.py tests/system/test_github_delete_ref_runtime.py tests/system/test_rollback_verification.py tests/system/test_f6_vop_registry.py
          echo "F6B_R3_STATIC_GATE=PASS"

  execute-one-governed-delete:
    needs: fresh-live-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      runner_bundle_b64: ${{ steps.execute.outputs.runner_bundle_b64 }}
    steps:
      - name: Checkout exact R3 head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Final fence one DELETE Runner absence and Receipt
        id: execute
        env:
          F6B_WRITE_TOKEN: ${{ github.token }}
          PREFLIGHT_DIGEST: ${{ needs.fresh-live-preflight.outputs.preflight_digest }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          python - <<'PY'
          import base64,hashlib,http.client,json,os,urllib.error,urllib.request
          from datetime import UTC,datetime
          from voodoo_product.execution_receipt_v2 import compose_write_execution_receipt_v2

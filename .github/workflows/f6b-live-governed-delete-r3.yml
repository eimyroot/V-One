lope_digest':env['envelope_digest'],'admission_digest':adm['admission_digest'],'lease_digest':lease['lease_digest'],'runner_identity_digest':identity['identity_digest'],'runner_boundary_digest':boundary['boundary_digest'],'credential_decision_digest':decision['decision_digest'],'runtime_activation_digest':activation['activation_digest'],'target_digest':target['target_digest'],'request_digest':request['request_digest'],'execution_id':execution_id,'observed_ref_sha':expected,'checked_at':checked,'temporal_model':os.environ['F6B_TEMPORAL_MODEL']},'preflight_digest')

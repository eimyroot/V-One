          try:
              conn.request('DELETE',f'/repos/{repo}/git/refs/{ref_path}',headers=headers);response=conn.getresponse();code=response.status;response.read()
          except Exception as exc:raise SystemExit(f'F6B_DELETE_PROVIDER_OUTCOME_AMBIGUOUS_NO_RETRY:{type(exc).__name__}') from exc

    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      verifier_bundle_b64: ${{ steps.verify.outputs.verifier_bundle_b64 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

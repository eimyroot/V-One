name: branch ruff normalization

on:
  push:
    branches:
      - agent/product-service-audit-unification-20260717

permissions:
  contents: write

concurrency:
  group: branch-ruff-normalization
  cancel-in-progress: false

jobs:
  normalize:
    if: github.repository == 'nulleimy/V-One'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Normalize changed Python files
        run: |
          python -m ruff check --fix \
            voodoo_product/service.py \
            voodoo_product/composition.py \
            tests/system/test_product_composition.py \
            scripts/product_readiness_gate.py
          python -m ruff check \
            voodoo_product/service.py \
            voodoo_product/composition.py \
            tests/system/test_product_composition.py \
            scripts/product_readiness_gate.py
          git diff --check
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Ruff changes required"
            exit 0
          fi
          git config user.name "VOODOO Governance Bot"
          git config user.email "governance-bot@users.noreply.github.com"
          git add \
            voodoo_product/service.py \
            voodoo_product/composition.py \
            tests/system/test_product_composition.py \
            scripts/product_readiness_gate.py
          git commit -m "style: normalize audit unification"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  compose-canonical-verification:
    needs: [execute-one-governed-delete, independent-absence-verifier]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact live head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compose canonical VerificationResult/v1 and final evidence
        shell: bash
        env:
          RUNNER_BUNDLE_B64: ${{ needs.execute-one-governed-delete.outputs.runner_bundle_b64 }}
          VERIFIER_BUNDLE_B64: ${{ needs.independent-absence-verifier.outputs.verifier_bundle_b64 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os
          from voodoo_product.rollback_verification import GitHubRefAbsenceObservation,IndependentVerificationBoundaryV2,VerifierGitHubRefAbsenceObservation,verify_github_ref_absence
          rb=json.loads(base64.b64decode(os.environ['RUNNER_BUNDLE_B64']).decode()); vb=json.loads(base64.b64decode(os.environ['VERIFIER_BUNDLE_B64']).decode())
          rr=rb['runner_observation']; br=vb['verification_boundary']; vr=vb['verifier_observation']
          runner=GitHubRefAbsenceObservation(**{k:v for k,v in rr.items() if k not in {'schema_version','observation_type','observation_digest'}},observation_digest=rr['observation_digest'])
          boundary=IndependentVerificationBoundaryV2(**{k:v for k,v in br.items() if k not in {'schema_version','boundary_type','boundary_digest'}},boundary_digest=br['boundary_digest'])
          verifier=VerifierGitHubRefAbsenceObservation(**{k:v for k,v in vr.items() if k not in {'schema_version','observation_type','observation_digest'}},observation_digest=vr['observation_digest'])
          observed,strength,result=verify_github_ref_absence(runner_observation=runner,verifier_observation=verifier,boundary=boundary,observed_post_state_revision='observed-post-state/f6b-live-r1',strength_revision='verification-strength/f6b-live-r1',result_revision='verification-result/f6b-live-r1')
          assert result.verdict=='VERIFIED'
          final={'schema_version':1,'bundle_type':'f6b-first-live-governed-delete-evidence/v1','head_sha':rb['head_sha'],'target':rb['target'],'execution_receipt_v2':rb['execution_receipt_v2'],'runner_observation':rr,'verifier_identity':vb['verifier_identity'],'independent_verification_boundary_v2':boundary.to_dict(),'verifier_credential_decision_v2':vb['verifier_credential_decision'],'verifier_observation':vr,'observed_post_state_v1':observed.to_dict(),'verification_strength_v1':strength.to_dict(),'verification_result_v1':result.to_dict(),'operation_proof_created':False,'operation_cell_created':False}
          encoded=base64.b64encode(json.dumps(final,sort_keys=True,separators=(',',':')).encode()).decode()
          print(f'F6B_VERIFICATION_RESULT=VERIFIED digest={result.result_digest}')
          print(f'F6B_EXECUTION_RECEIPT_V2_DIGEST={rb["execution_receipt_v2"]["receipt_digest"]}')
          print(f'F6B_FINAL_EVIDENCE_B64={encoded}')
          print('F6B_FIRST_LIVE_GOVERNED_DELETE=COMPLETE')
          PY

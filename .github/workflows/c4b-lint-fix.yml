name: c4b-lint-fix

on:
  push:
    branches:
      - feat/durable-execution-epoch-lease-r1
    paths:
      - .github/workflows/c4b-lint-fix.yml

permissions:
  contents: write

jobs:
  patch-unused-import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: feat/durable-execution-epoch-lease-r1
      - name: Remove exact unused import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("voodoo_product/execution_lease_persistence.py")
          text = path.read_text(encoding="utf-8")
          needle = "    ExecutionFenceDenied,\n"
          if text.count(needle) != 1:
              raise SystemExit("expected unused import was not found exactly once")
          path.write_text(text.replace(needle, ""), encoding="utf-8")
          PY
          git diff --check
          git diff -- voodoo_product/execution_lease_persistence.py
      - name: Commit exact lint fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Eimy Herrer"
          git config user.email "fck.police.228@gmail.com"
          git add voodoo_product/execution_lease_persistence.py
          git commit -m "fix(dispatch): remove unused execution fence import"
          git push origin HEAD:feat/durable-execution-epoch-lease-r1

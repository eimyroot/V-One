minimum_pre_commit_version: "3.7.0"

default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: python-compile
        name: Python compile gate
        entry: python -m compileall -q voodoo_product scripts tests
        language: system
        pass_filenames: false
        stages: [pre-push]
